[project]
name = "workers-platform"
version = "0.1.0"
description = "Temporal Python workers and workflow runtime for Platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12.0",
  "feedparser>=6.0.11",
  "httpx>=0.28.0",
  "lxml>=5.0.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.11.0",
  "temporalio>=1.8.0",
  "trafilatura>=2.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
